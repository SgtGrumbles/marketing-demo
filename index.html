<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A demo with fictional data: ask search engines not to list it. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Pulse · Marketing Analytics</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash. Dark is the default.
      document.documentElement.classList.add('dark')
      try {
        if (localStorage.getItem('pulse-theme') === 'light') document.documentElement.classList.remove('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
